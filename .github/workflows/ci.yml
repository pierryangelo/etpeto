name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.0

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Run canonical checks
        run: make check

      - name: Enforce coverage floors
        run: make coverage

      - name: Verify generated and formatted files are committed
        run: git diff --exit-code

  integration:
    name: Integration suites
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TYPST_VERSION: 0.14.2
      TYPST_SHA256: a6044cbad2a954deb921167e257e120ac0a16b20339ec01121194ff9d394996d
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned Typst
        run: |
          set -eu
          archive="typst-x86_64-unknown-linux-musl.tar.xz"
          curl --fail --location --output "/tmp/${archive}" \
            "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/${archive}"
          echo "${TYPST_SHA256}  /tmp/${archive}" | sha256sum -c -
          tar -xJf "/tmp/${archive}" -C /tmp
          sudo install -m 0555 "/tmp/typst-x86_64-unknown-linux-musl/typst" /usr/local/bin/typst
          typst --version

      - name: Run integration suites
        run: make test-integration

  compose:
    name: Compose smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-only-postgres-password
      ETPETO_RENDERER_TOKEN: ci-only-renderer-token-with-sufficient-entropy
      ETPETO_ADMIN_EMAIL: ci@example.invalid
      ETPETO_ADMIN_DISPLAY_NAME: Verificação Automatizada
      ETPETO_ADMIN_PASSWORD: ci-only-administrator-password
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build and start reference stack
        run: docker compose up --build --wait

      - name: Run public smoke contract
        run: sh scripts/smoke-compose.sh

      - name: Provision the first administrator
        run: docker compose run --rm --no-TTY bootstrap < /dev/null

      - name: Exercise the main journey
        run: sh scripts/smoke-journey.sh

      - name: Show service state
        if: always()
        run: docker compose ps -a

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop stack
        if: always()
        run: docker compose down -v
